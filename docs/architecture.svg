<svg width="900" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif">
<title>FinLake Brasil — Arquitetura de Dados</title>
<desc>Arquitetura Medallion com dois domínios BCB e CVM, camadas Bronze Silver Gold e cross-domain join no Gold com visualização no Metabase</desc>

<rect width="900" height="420" fill="#0f1117" rx="16"/>

<!-- Título -->
<text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600" letter-spacing="0.5">FinLake Brasil — Arquitetura de Dados</text>

<!-- Cabeçalhos das camadas -->
<text x="155" y="68" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Bronze</text>
<text x="335" y="68" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Silver</text>
<text x="515" y="68" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Gold</text>
<text x="705" y="68" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Visualização</text>
<line x1="60" y1="76" x2="840" y2="76" stroke="#334155" stroke-width="0.5"/>

<!-- Rótulos de domínio -->
<text x="30" y="145" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">BCB</text>
<text x="30" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">API SGS</text>
<line x1="48" y1="148" x2="68" y2="148" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

<text x="30" y="290" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">CVM</text>
<text x="30" y="305" text-anchor="middle" fill="#94a3b8" font-size="10">Portal</text>
<line x1="48" y1="293" x2="68" y2="293" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

<defs>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowCross" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- BRONZE BCB -->
<rect x="70" y="100" width="170" height="96" rx="10" fill="#1c1a14" stroke="#d97706" stroke-width="1"/>
<text x="155" y="124" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">bronze_bcb</text>
<text x="155" y="144" text-anchor="middle" fill="#d97706" font-size="11">SELIC · IPCA · PTAX</text>
<text x="155" y="162" text-anchor="middle" fill="#92400e" font-size="10">14k+ registros</text>
<text x="155" y="178" text-anchor="middle" fill="#92400e" font-size="10">backfill desde 1994</text>

<!-- BRONZE → SILVER BCB -->
<line x1="242" y1="148" x2="262" y2="148" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

<!-- SILVER BCB -->
<rect x="264" y="100" width="142" height="96" rx="10" fill="#0f1e1c" stroke="#0d9488" stroke-width="1"/>
<text x="335" y="124" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="600">silver_bcb</text>
<text x="335" y="144" text-anchor="middle" fill="#0d9488" font-size="11">3 modelos dbt</text>
<text x="335" y="162" text-anchor="middle" fill="#134e4a" font-size="10">16 testes</text>
<text x="335" y="178" text-anchor="middle" fill="#134e4a" font-size="10">tipagem + validação</text>

<!-- SILVER → GOLD BCB -->
<line x1="408" y1="148" x2="428" y2="148" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

<!-- GOLD BCB -->
<rect x="430" y="100" width="160" height="96" rx="10" fill="#160f2a" stroke="#7c3aed" stroke-width="1"/>
<text x="510" y="124" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">gold_bcb</text>
<text x="510" y="144" text-anchor="middle" fill="#7c3aed" font-size="11">macro_diario</text>
<text x="510" y="162" text-anchor="middle" fill="#7c3aed" font-size="11">macro_mensal</text>
<text x="510" y="178" text-anchor="middle" fill="#3b1f6a" font-size="10">SELIC real · PTAX · IPCA</text>

<!-- CROSS-DOMAIN: gold_bcb → gold_cvm -->
<line x1="510" y1="198" x2="510" y2="215" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="520" y="228" fill="#818cf8" font-size="10" font-style="italic">cross-domain</text>
<line x1="510" y1="238" x2="510" y2="255" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowCross)"/>

<!-- BRONZE CVM -->
<rect x="70" y="248" width="170" height="96" rx="10" fill="#0d1a26" stroke="#0369a1" stroke-width="1"/>
<text x="155" y="272" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">bronze_cvm</text>
<text x="155" y="292" text-anchor="middle" fill="#0369a1" font-size="11">cadastro · informe</text>
<text x="155" y="310" text-anchor="middle" fill="#0c4a6e" font-size="10">41k fundos</text>
<text x="155" y="326" text-anchor="middle" fill="#0c4a6e" font-size="10">6.5M registros</text>

<!-- BRONZE → SILVER CVM -->
<line x1="242" y1="296" x2="262" y2="296" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

<!-- SILVER CVM -->
<rect x="264" y="248" width="142" height="96" rx="10" fill="#0f1e1c" stroke="#0d9488" stroke-width="1"/>
<text x="335" y="272" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="600">silver_cvm</text>
<text x="335" y="292" text-anchor="middle" fill="#0d9488" font-size="11">fundos ativos</text>
<text x="335" y="310" text-anchor="middle" fill="#134e4a" font-size="10">informe limpo</text>
<text x="335" y="326" text-anchor="middle" fill="#134e4a" font-size="10">join c/ cadastro</text>

<!-- SILVER → GOLD CVM -->
<line x1="408" y1="296" x2="428" y2="296" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

<!-- GOLD CVM -->
<rect x="430" y="248" width="160" height="96" rx="10" fill="#160f2a" stroke="#7c3aed" stroke-width="1"/>
<text x="510" y="272" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">gold_cvm</text>
<text x="510" y="292" text-anchor="middle" fill="#7c3aed" font-size="11">fundo_diario</text>
<text x="510" y="310" text-anchor="middle" fill="#7c3aed" font-size="11">fundo_mensal</text>
<text x="510" y="326" text-anchor="middle" fill="#3b1f6a" font-size="10">α selic · α ipca</text>

<!-- GOLD BCB → METABASE -->
<line x1="592" y1="148" x2="620" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

<!-- GOLD CVM → METABASE -->
<line x1="592" y1="296" x2="620" y2="296" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

<!-- METABASE -->
<rect x="622" y="112" width="166" height="220" rx="10" fill="#0a1628" stroke="#1d4ed8" stroke-width="1"/>
<text x="705" y="158" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="600">Metabase</text>
<text x="705" y="178" text-anchor="middle" fill="#1d4ed8" font-size="11">4 dashboards</text>
<text x="705" y="196" text-anchor="middle" fill="#1d4ed8" font-size="11">16 cards analíticos</text>
<line x1="645" y1="210" x2="765" y2="210" stroke="#1e3a5f" stroke-width="0.5"/>
<text x="705" y="228" text-anchor="middle" fill="#1e40af" font-size="10">BCB Macro</text>
<text x="705" y="244" text-anchor="middle" fill="#1e40af" font-size="10">Visão Geral Fundos</text>
<text x="705" y="260" text-anchor="middle" fill="#1e40af" font-size="10">Rentabilidade</text>
<text x="705" y="276" text-anchor="middle" fill="#1e40af" font-size="10">Fundos vs. Macro</text>
<text x="705" y="296" text-anchor="middle" fill="#0f2a5e" font-size="9">localhost:3030</text>

<!-- Stack pills -->
<rect x="60" y="370" width="106" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="113" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">Airflow 2.10.4</text>

<rect x="176" y="370" width="76" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="214" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">dbt core</text>

<rect x="262" y="370" width="96" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="310" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">Python 3.12</text>

<rect x="368" y="370" width="110" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="423" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">PostgreSQL 15</text>

<rect x="488" y="370" width="116" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="546" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">Docker Compose</text>

<rect x="614" y="370" width="60" height="22" rx="11" fill="#1c2333" stroke="#334155" stroke-width="0.5"/>
<text x="644" y="385" text-anchor="middle" fill="#94a3b8" font-size="10">uv</text>
</svg>
